<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Frog Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px; 
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
        }
         canvas {
            border: 4px solid #228B22;
            border-radius: 15px;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 70%, #228B22 100%);
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
            .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
         .score, .health, .timer {
            font-size: 20px;
            color: #2E8B57;
            font-weight: bold;
        }
         .health {
            color: #DC143C;
        }
</body>
</html>
