<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Frog Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px; 
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
        }
         canvas {
            border: 4px solid #228B22;
            border-radius: 15px;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 70%, #228B22 100%);
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
            .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
         .score, .health, .timer {
            font-size: 20px;
            color: #2E8B57;
            font-weight: bold;
        }
         .health {
            color: #DC143C;
        }
        .timer {
            color: #FF8C00;
        }
         .instructions {
            font-size: 16px;
            color: #2E8B57;
            margin-bottom: 10px;
        }
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 10;
            max-width: 400px;
        }
        .highscore-panel {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            width: 220px;
            flex-shrink: 0;
        }
        .highscore-title {
            font-size: 18px;
            color: #2E8B57;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .highscore-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
         .highscore-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
        }
        .highscore-item.new-record {
            animation: glow 1s ease-in-out infinite alternate;
            background: rgba(255, 215, 0, 0.3);
        }
        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
            to { box-shadow: 0 0 15px rgba(255, 215, 0, 0.8); }
        }
        .highscore-rank {
            font-weight: bold;
            color: #2E8B57;
            min-width: 20px;
        }
        .highscore-score {
            font-weight: bold;
            color: #FF8C00;
        }
         .clear-scores {
            background: #DC143C;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s;
        }
        .clear-scores:hover {
            background: #B22222;
        }
        button {
            background: #32CD32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #228B22;
        }
        .new-record-text {
            color: #FFD700;
            font-weight: bold;
            font-size: 18px;
            margin: 10px 0;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
    </head>
    <body>
 <div class="game-container"></div>
 <div class="controls">
            <div class="game-info">
                <div class="health">❤ Health: <span id="health">3</span></div>
                <div class="score">🏆 Score: <span id="score">0</span></div>
                <div class="timer">⏱ Time: <span id="timer">60</span>s</div>
            </div>
            <div class="instructions">Use arrow keys or WASD to move • Spacebar to jump • Catch flies, avoid staying still too long!</div>
        </div>
         <canvas id="gameCanvas" width="800" height="600"></canvas>
         <div class="game-over" id="gameOver">
            <h2>🐸 Ribbit! Great job! 🐸</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <div id="newRecordMessage"></div>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>
    <div class="highscore-panel">
        <div class="highscore-title">🏆 Top Scores 🏆</div>
        <ul class="highscore-list" id="highscoreList">
        </ul>
        <button class="clear-scores" onclick="clearHighScores()">Clear Scores</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const healthElement = document.getElementById('health');
        const timerElement = document.getElementById('timer');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const highscoreListElement = document.getElementById('highscoreList');
        const newRecordMessageElement = document.getElementById('newRecordMessage');
        
        let score = 0;
        let gameRunning = true;
        let keys = {};
        let health = 3;
        let timeLeft = 60; 
        let gameTimer = 0;
        let highScores = [];
         const frog = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            size: 40,
            speed: 5,
            jumpHeight: 0,
            isJumping: false,
            jumpSpeed: 0
        };
        let flies = [];
        let flySpawnTimer = 0;
        let lastMoveTime = 0;
        let idleTimer = 0;
        const lilyPads = [
            { x: 100, y: canvas.height - 100, size: 60 },
            { x: 300, y: canvas.height - 150, size: 70 },
            { x: 500, y: canvas.height - 120, size: 65 },
            { x: 650, y: canvas.height - 140, size: 60 }
        ];
         function addHighScore(newScore) {
            const timestamp = new Date().toLocaleString();
            highScores.push({ score: newScore, date: timestamp });
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 10); // Keep only top 10
            updateHighScoreDisplay();
        }
        function updateHighScoreDisplay() {
            highscoreListElement.innerHTML = '';
            
            if (highScores.length === 0) {
                const emptyItem = document.createElement('li');
                emptyItem.className = 'highscore-item';
                emptyItem.innerHTML = '<span style="color: #888; font-style: italic;">No scores yet!</span>';
                highscoreListElement.appendChild(emptyItem);
                return;
            }
               highScores.forEach((scoreData, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'highscore-item';
                
                const isNewest = index === 0 && scoreData.score === score && gameRunning === false;
                if (isNewest) {
                    listItem.classList.add('new-record');
                }
                
                const rank = index + 1;
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}.`;
                
                listItem.innerHTML = `
                    <span class="highscore-rank">${medal}</span>
                    <span class="highscore-score">${scoreData.score}</span>
                `;
                              listItem.title = `Scored on ${scoreData.date}`;
                
                highscoreListElement.appendChild(listItem);
            });
        }

        function clearHighScores() {
            if (confirm('Are you sure you want to clear all high scores?')) {
                highScores = [];
                updateHighScoreDisplay();
            }
        }
               function checkForNewRecord(newScore) {
            const isNewRecord = highScores.length === 0 || newScore > highScores[0].score;
            const isTopTen = highScores.length < 10 || newScore > highScores[highScores.length - 1].score;
            
            if (isNewRecord) {
                newRecordMessageElement.innerHTML = '<div class="new-record-text">🎉 NEW HIGH SCORE! 🎉</div>';
            } else if (isTopTen) {
                newRecordMessageElement.innerHTML = '<div class="new-record-text">🌟 Made it to Top 10! 🌟</div>';
            } else {
                newRecordMessageElement.innerHTML = '';
            }
            
            return isNewRecord || isTopTen;
        }
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
       function drawFrog() {
            const x = frog.x;
            const y = frog.y - frog.jumpHeight;
            const size = frog.size;

            ctx.fillStyle = '#32CD32';
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#90EE90';
            ctx.beginPath();
            ctx.arc(x, y + 5, size * 0.7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.arc(x - 15, y - 15, 8, 0, Math.PI * 2);
            ctx.arc(x + 15, y - 15, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(x - 15, y - 15, 4, 0, Math.PI * 2);
            ctx.arc(x + 15, y - 15, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#228B22';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y + 5, 15, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }
           function drawLilyPads() {
            lilyPads.forEach(pad => {
                ctx.fillStyle = '#2E8B57';
                ctx.beginPath();
                ctx.ellipse(pad.x, pad.y, pad.size, pad.size * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(pad.x, pad.y - pad.size * 0.8);
                ctx.lineTo(pad.x, pad.y + pad.size * 0.8);
                ctx.moveTo(pad.x - pad.size, pad.y);
                ctx.lineTo(pad.x + pad.size, pad.y);
                ctx.stroke();
            });
        }
               function drawFly(fly) {
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.ellipse(fly.x, fly.y, 6, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.ellipse(fly.x - 8, fly.y - 3, 8, 4, -0.3, 0, Math.PI * 2);
            ctx.ellipse(fly.x + 8, fly.y - 3, 8, 4, 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
       function spawnFly() {
            flies.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 200) + 50,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                life: 300 + Math.random() * 200
            });
        }
      function updateFrog() {
            if (!gameRunning) return;

            let moved = false;
            const oldX = frog.x;
            const oldY = frog.y;

            if (keys['arrowleft'] || keys['a']) {
                frog.x = Math.max(frog.size, frog.x - frog.speed);
                moved = true;
            }
            if (keys['arrowright'] || keys['d']) {
                frog.x = Math.min(canvas.width - frog.size, frog.x + frog.speed);
                moved = true;
            }
            if (keys['arrowup'] || keys['w']) {
                frog.y = Math.max(frog.size, frog.y - frog.speed);
                moved = true;
            }
            if (keys['arrowdown'] || keys['s']) {
                frog.y = Math.min(canvas.height - frog.size, frog.y + frog.speed);
                moved = true;
            }
            if (moved || (oldX !== frog.x || oldY !== frog.y)) {
                idleTimer = 0;
            } else {
                idleTimer++;
                if (idleTimer > 300) { 
                    health--;
                    healthElement.textContent = health;
                    idleTimer = 0;
                    if (health <= 0) {
                        endGame("You stayed still too long and got eaten by predators!");
                        return;
                 }}}

            if (keys[' '] && !frog.isJumping) {
                frog.isJumping = true;
                frog.jumpSpeed = -12;
                moved = true;
            }

            if (frog.isJumping) {
                frog.jumpHeight -= frog.jumpSpeed;
                frog.jumpSpeed += 0.8;
                
                if (frog.jumpHeight <= 0) {
                    frog.jumpHeight = 0;
                    frog.isJumping = false;
                    frog.jumpSpeed = 0;
               }}}


</body>
</html>
