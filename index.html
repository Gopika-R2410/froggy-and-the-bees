<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Frog Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px; 
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
        }
         canvas {
            border: 4px solid #228B22;
            border-radius: 15px;
            background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 70%, #228B22 100%);
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
            .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
         .score, .health, .timer {
            font-size: 20px;
            color: #2E8B57;
            font-weight: bold;
        }
         .health {
            color: #DC143C;
        }
        .timer {
            color: #FF8C00;
        }
         .instructions {
            font-size: 16px;
            color: #2E8B57;
            margin-bottom: 10px;
        }
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 10;
            max-width: 400px;
        }
        .highscore-panel {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            width: 220px;
            flex-shrink: 0;
        }
        .highscore-title {
            font-size: 18px;
            color: #2E8B57;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .highscore-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
         .highscore-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
        }
        .highscore-item.new-record {
            animation: glow 1s ease-in-out infinite alternate;
            background: rgba(255, 215, 0, 0.3);
        }
        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
            to { box-shadow: 0 0 15px rgba(255, 215, 0, 0.8); }
        }
        .highscore-rank {
            font-weight: bold;
            color: #2E8B57;
            min-width: 20px;
        }
        .highscore-score {
            font-weight: bold;
            color: #FF8C00;
        }
         .clear-scores {
            background: #DC143C;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s;
        }
        .clear-scores:hover {
            background: #B22222;
        }
        button {
            background: #32CD32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }

</body>
</html>
